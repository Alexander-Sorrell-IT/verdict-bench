# keys.example.toml — copy to keys.toml (GITIGNORED) or drop plain key files in secrets/.
#
# A key never belongs in the repo. The relay reads it from a file, the arms read it from
# an env var. Nothing in this file's real version is ever committed, and the relay never
# logs an Authorization header.
#
#   cp keys.example.toml keys.toml      # keys.toml is in .gitignore
#   mkdir -p secrets && chmod 700 secrets
#   printf '%s' "$NVIDIA_API_KEY" > secrets/nvidia.key && chmod 600 secrets/nvidia.key

# Provider -> where its key comes from. base_url must be OpenAI-compatible (see spec/providers.json).
[nvidia]
env_var = "NVIDIA_API_KEY"          # preferred: keep the key in the environment
key_file = "secrets/nvidia.key"     # or: one line, no trailing newline needed, chmod 600
base_url = "https://integrate.api.nvidia.com/v1"
rpm = 35

[openrouter]
env_var = "OPENROUTER_API_KEY"
key_file = "secrets/openrouter.key"
base_url = "https://openrouter.ai/api/v1"
rpm = 60

[groq]
env_var = "GROQ_API_KEY"
key_file = "secrets/groq.key"
base_url = "https://api.groq.com/openai/v1"
rpm = 30

[gemini]
env_var = "GEMINI_API_KEY"
key_file = "secrets/gemini.key"
base_url = "https://generativelanguage.googleapis.com/v1beta/openai"
rpm = 60

# Run defaults used by operator mode. Both arms MUST use the same provider and model:
# that identity is the controlled variable of the whole benchmark.
[run]
provider = "nvidia"
model = "nvidia/nemotron-3-ultra-550b-a55b"
temperature = 0.0
budget = { max_steps = 400, max_model_calls = 200, max_wall_seconds = 2700 }